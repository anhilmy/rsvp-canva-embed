# Production Docker Compose with nginx
version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: rsvp-mongodb
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=rsvp_wishes
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - rsvp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rsvp-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/rsvp_wishes
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rsvp-network

  nginx:
    image: nginx:alpine
    container_name: rsvp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rsvp-network

volumes:
  mongodb_data:

networks:
  rsvp-network:
    driver: bridge
