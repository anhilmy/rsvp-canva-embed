# Production Docker Compose
# Services: nginx, backend, admin, canva-app, mongodb
# Run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: rsvp-mongodb
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: rsvp_wishes
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - rsvp-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rsvp-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/rsvp_wishes
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rsvp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Admin Dashboard
  admin:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_API_URL:-/api}
    container_name: rsvp-admin
    restart: unless-stopped
    networks:
      - rsvp-network

  # Canva App Frontend
  canva-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CANVA_BACKEND_HOST: ${CANVA_BACKEND_HOST}
    container_name: rsvp-canva-app
    restart: unless-stopped
    networks:
      - rsvp-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rsvp-nginx
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin
      - canva-app
    restart: unless-stopped
    networks:
      - rsvp-network

volumes:
  mongodb_data:
    driver: local

networks:
  rsvp-network:
    driver: bridge
